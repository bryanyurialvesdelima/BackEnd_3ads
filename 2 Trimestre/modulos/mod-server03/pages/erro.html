<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - 404</title>
    <style>
        /* Variáveis de Cor (Mesmo tema Dark da Inicial) */
        :root {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --bg-badge: #334155;
            
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-light: #f1f5f9;
            --accent-color: #f59e0b; /* Amarelo/Laranja para alerta */

            --btn-primary-bg: #2563eb;
            --btn-primary-hover: #1d4ed8;
            
            --radius-card: 16px;
            --radius-btn: 8px;
            --transition-speed: 0.2s ease;
        }

        /* Resets básicos */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        /* Card Principal */
        .card {
            background-color: var(--bg-card);
            padding: 2.5rem 2rem;
            border-radius: var(--radius-card);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Destaque do Erro (404 / Ícone) */
        .error-code {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Botão para voltar */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-btn);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            background-color: var(--btn-primary-bg);
            color: var(--text-primary);
            transition: background-color var(--transition-speed), transform var(--transition-speed);
        }

        .btn:hover,
        .btn:focus-visible {
            background-color: var(--btn-primary-hover);
            outline: none;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <main class="card">
        
        <div class="error-code" aria-hidden="true">
            ⚠️ 404
        </div>

        <h1 class="title">Página Não Encontrada</h1>
        
        <p class="subtitle">
            Ops! A página que você está procurando não existe ou foi movida.
        </p>

        <nav>
            <a href="/" class="btn">
                <span aria-hidden="true">🏠</span> Voltar para a Página Inicial
            </a>
        </nav>
    </main>

</body>
</html>
